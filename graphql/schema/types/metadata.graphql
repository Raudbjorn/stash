input DetectSceneCutsInput {
  "Scene IDs to process. If empty, all scenes are processed."
  sceneIDs: [ID!]
  "Scene-change sensitivity, 0-1. Higher values only detect harder cuts. Defaults to 0.4."
  threshold: Float
  "Downscale video to this width before analysis, for speed. Defaults to 320. 0 disables downscaling."
  downscaleWidth: Int
}

input AnalyzeSceneMetadataInput {
  "Scene IDs to process. If empty, all scenes are processed."
  sceneIDs: [ID!]
  "Compute and log proposed changes without writing anything."
  dryRun: Boolean
  "Performer scraper IDs allowed to verify newly-discovered names."
  performerVerifierScraperIDs: [ID!]
  "Configured Stash-box endpoints allowed to verify newly-discovered performer names."
  performerVerifierStashBoxEndpoints: [String!]
  "Explicit ordered authority policy. Lower priority values are evaluated first."
  providerPolicies: [SceneMetadataProviderPolicyInput!]
  "Allow a replace-mode provider to remove local performer relationships. Defaults to false."
  replaceLocalPerformersFromRemote: Boolean
  "Minimum plausibility score (0-1) for a newly-discovered performer name to be looked up and, if confirmed, created. Defaults to 0.6."
  performerConfidenceThreshold: Float
  "Minimum confidence (0-1) for a resolved date to be written to a scene that doesn't already have one. Defaults to 0.6."
  dateConfidenceThreshold: Float
  "Allow overwriting a scene's existing date. Only ever applied from a high-confidence, uncontested signal."
  overwriteExistingDate: Boolean
  "Also analyze the scene's details/description text (off by default; often noisy marketing copy)."
  useDetails: Boolean
  "Use the configured local AI provider once to narrow ambiguous exact-name performer identities."
  useLocalAIContext: Boolean
  "Studio scraper IDs allowed to verify newly-discovered studio names. Empty means none."
  studioVerifierScraperIDs: [ID!]
  "Configured Stash-box endpoints allowed to verify newly-discovered studio names. Empty means none."
  studioVerifierStashBoxEndpoints: [String!]
  "Use the configured local AI provider to decide which studio metadata provider should be queried for a scene, based on the source strings (filename, title, NFO, container metadata)."
  useLocalAIStudioProviderSelection: Boolean
  "Allow replacing a user-authored title. By default only empty or filename-derived titles are changed."
  overwriteExistingTitle: Boolean
}
