type AITaggingStatus {
  "The configured provider, or empty when none is configured."
  provider: String!
  "Whether at least one configured analysis service can run."
  available: Boolean!
  "Whether the configured local or remote tagging provider can run."
  localAvailable: Boolean!
  "Whether direct Voyage video-to-taxonomy retrieval can run."
  voyageAvailable: Boolean!
  message: String
  "What to do to make it available, when it is not (e.g. \"configure a VLM model in Settings -> AI Server\")."
  remediation: String
}

type AITaggingSpan {
  start: Float!
  end: Float!
  confidence: Float
  tagID: ID
}

type AITaggingSpanGroup {
  category: String!
  label: String!
  spans: [AITaggingSpan!]!
}

type AITaggingLabelSupport {
  tag: String!
  stashID: String
  frames: Int!
  spanCount: Int!
  firstAt: Float!
  lastAt: Float!
}

"Result of triggering per-scene analysis. Mirrors the REST layer's 409/already-in-progress case as a typed field rather than a GraphQL error, so a duplicate click is a normal, renderable result."
type AnalyzeSceneWithAIResult {
  taskID: ID!
  status: String!
  alreadyInProgress: Boolean!
}
