"""
Ollama Configuration
"""
type OllamaConfig {
  baseUrl: String!
  model: String!
  timeout: Int!
  enabled: Boolean!
  fallbackToTraditionalDict: Boolean!
  promptTemplate: String!
  "Whether a Mistral API key is stored. Never echoes the effective key (which may fall back to $MISTRAL_API_KEY)."
  mistralApiKeySet: Boolean!
}

"""
Ollama Configuration Input
"""
input OllamaConfigInput {
  baseUrl: String!
  model: String!
  timeout: Int!
  enabled: Boolean!
  fallbackToTraditionalDict: Boolean!
  promptTemplate: String!
  "Only written when non-null; omit/null leaves the stored key untouched."
  mistralApiKey: String
}

"""
Dictionary Entry from Ollama
"""
type OllamaDictionaryEntry {
  word: String!
  pronunciation: String
  definitions: [OllamaDictionaryDefinition!]!
  morphology: String
  aiSource: String
}

"""
Dictionary Definition
"""
type OllamaDictionaryDefinition {
  partOfSpeech: String!
  meaning: String!
  examples: [String!]!
}

"""
Ollama Word Explanation Input
"""
input OllamaExplainWordInput {
  word: String!
  context: String!
  language: String
  model: String
  provider: String
}

"""
Ollama Generation Input
"""
input OllamaGenerateInput {
  prompt: String!
  model: String
}

"""
Ollama Generation Result
"""
type OllamaGenerateResult {
  response: String!
  model: String!
  totalDuration: Int
  evalCount: Int
}

"""
Ollama Service Status
"""
type OllamaStatus {
  available: Boolean!
  config: OllamaConfig!
  models: [String!]!
  version: String
}
