"The AI server's own task queue. Separate from Stash's regular Job queue (jobsSubscribe) - a distinct scheduler for AI-server work such as tagging analysis."
enum AITaskStatus {
  QUEUED
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
  STREAMING
}

enum AITaskPriority {
  HIGH
  NORMAL
  LOW
}

type AITask {
  id: ID!
  actionID: String!
  service: String!
  priority: AITaskPriority!
  status: AITaskStatus!
  "Epoch seconds."
  submittedAt: Float!
  startedAt: Float
  finishedAt: Float
  error: String
  "Single detail-view entity acted on, when applicable."
  itemID: ID
  "Parameters submitted with the task."
  parameters: Map
  "Terminal handler response retained for debugging."
  result: Any
  cancelRequested: Boolean!
}

input AITaskListFilter {
  service: String
  status: AITaskStatus
}
