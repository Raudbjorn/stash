fragment AIServerConfigData on AIServerConfig {
  enabled
  taggingProvider
  taggingServerURL
  taggingOpenAIKeySet
  taggingModelDir
  taggingRulesDir
  taggingFrameInterval
  taggingThreshold
  taggingMaxSpanMerge
  taggingVLMModel
  taggingVLMLabels
  taggingVLMGPULayers
  taggingVLMContext
  taggingAnalyzeMode
  taggingVLMAcceptMode
  taggingVLMVoyageAPIKeySet
  taggingVLMVoyageRerankModel
  taggingVLMVoyageRerankTopK
  taggingVLMVoyageEndpoint
  taggingVLMVoyageVideoEnabled
  taggingVLMVoyageVideoModel
  taggingVLMVoyageSegmentSecs
  taggingVLMVoyageDimension
  taggingVLMVoyageEmbeddingEndpoint
  taggingTaxonomyEndpoint
  taggingTaxonomyAPIKeySet
  taggingTaxonomyCategories
  taggingTaxonomyMaxCandidates
}

fragment AIServerStatusData on AIServerStatus {
  state
  enabled
  ready
  hasVLMProvider
  hasLocalTextProvider
  availableVLMModels
  availableVoyageRerankModels
  availableVoyageVideoModels
  backendVersion
  schemaVersion
  error
  database {
    status
    message
  }
  config {
    ...AIServerConfigData
  }
}

fragment AITaggingStatusData on AITaggingStatus {
  provider
  available
  localAvailable
  voyageAvailable
  message
  remediation
}

fragment AITaskData on AITask {
  id
  actionID
  service
  priority
  status
  submittedAt
  startedAt
  finishedAt
  error
  cancelRequested
  itemID
  parameters
  result
}
