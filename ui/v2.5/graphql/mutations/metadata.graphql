mutation MetadataImport {
  metadataImport
}

mutation MetadataExport {
  metadataExport
}

mutation ExportObjects($input: ExportObjectsInput!) {
  exportObjects(input: $input)
}

mutation ImportObjects($input: ImportObjectsInput!) {
  importObjects(input: $input)
}

mutation MetadataScan($input: ScanMetadataInput!) {
  metadataScan(input: $input)
}

mutation MetadataGenerate($input: GenerateMetadataInput!) {
  metadataGenerate(input: $input)
}

mutation MetadataAutoTag($input: AutoTagMetadataInput!) {
  metadataAutoTag(input: $input)
}

mutation MetadataDetectSceneCuts($input: DetectSceneCutsInput!) {
  metadataDetectSceneCuts(input: $input)
}

mutation MetadataAnalyzeScenes($input: AnalyzeSceneMetadataInput!) {
  metadataAnalyzeScenes(input: $input)
}
mutation SceneMetadataModelInstall($modelKey: ID!) {
  sceneMetadataModelInstall(modelKey: $modelKey)
}

mutation SceneMetadataModelUninstall($modelKey: ID!) {
  sceneMetadataModelUninstall(modelKey: $modelKey)
}

mutation SceneMetadataModelRepair($key: String!) {
  sceneMetadataModelRepair(key: $key)
}

mutation SceneMetadataModelAssign(
  $role: SceneMetadataModelRole!
  $modelKey: ID
) {
  sceneMetadataModelAssign(role: $role, modelKey: $modelKey)
}

mutation SceneMetadataModelReload {
  sceneMetadataModelReload
}

mutation MetadataIdentify($input: IdentifyMetadataInput!) {
  metadataIdentify(input: $input)
}

mutation MetadataClean($input: CleanMetadataInput!) {
  metadataClean(input: $input)
}

mutation MetadataCleanGenerated($input: CleanGeneratedInput!) {
  metadataCleanGenerated(input: $input)
}

mutation MigrateHashNaming {
  migrateHashNaming
}

mutation BackupDatabase($input: BackupDatabaseInput!) {
  backupDatabase(input: $input)
}

mutation AnonymiseDatabase($input: AnonymiseDatabaseInput!) {
  anonymiseDatabase(input: $input)
}

mutation OptimiseDatabase {
  optimiseDatabase
}

mutation AcceptSceneMetadataProposalAction(
  $runId: String!
  $sceneId: ID!
  $actionIds: [ID!]!
) {
  acceptSceneMetadataProposalAction(
    runId: $runId
    sceneId: $sceneId
    actionIds: $actionIds
  )
}

mutation RejectSceneMetadataProposalAction(
  $runId: String!
  $sceneId: ID!
  $actionIds: [ID!]!
) {
  rejectSceneMetadataProposalAction(
    runId: $runId
    sceneId: $sceneId
    actionIds: $actionIds
  )
}

mutation SelectSceneMetadataRemoteCandidate(
  $runId: String!
  $sceneId: ID!
  $endpoint: String!
  $remoteId: String!
) {
  selectSceneMetadataRemoteCandidate(
    runId: $runId
    sceneId: $sceneId
    endpoint: $endpoint
    remoteId: $remoteId
  )
}

mutation ApplySceneMetadataPlan($runId: String!, $sceneIds: [ID!]!) {
  applySceneMetadataPlan(runId: $runId, sceneIds: $sceneIds)
}
