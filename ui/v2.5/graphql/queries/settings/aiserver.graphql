# Lightweight status used wherever the UI needs to know whether AI-backed
# analysis is available. aiTaggingStatus gates scene tagging. Local metadata
# context can use either the embedded vision-language provider or an enabled
# OpenAI-compatible text-generation server.
query AIServerAvailability {
  aiServerStatus {
    ...AIServerStatusData
  }
  aiTaggingStatus {
    ...AITaggingStatusData
  }
}

# Full settings-panel query: status, tagging status and the task queue/history.
query AIServerSettings {
  aiServerStatus {
    ...AIServerStatusData
  }
  aiTaggingStatus {
    ...AITaggingStatusData
  }
  aiTasks {
    ...AITaskData
  }
  aiTaskHistory(limit: 20) {
    ...AITaskData
  }
}
