query SystemStatus {
  systemStatus {
    databaseSchema
    databasePath
    appSchema
    status
    configPath
    os
    workingDir
    homeDir
    ffmpegPath
    ffprobePath
  }
}
query SceneMetadataModels {
  sceneMetadataModels {
    key
    displayName
    family
    precision
    size
    license
    licenseURL
    installed
    lastError
  }
}

query SceneMetadataModelAssignments {
  sceneMetadataModelAssignments {
    role
    modelKey
  }
}

query SceneMetadataModelStatus {
  sceneMetadataModelStatus {
    activeKey
    state
    cachePath
    lastError
    runtimeAvailable
  }
}
