query SystemStatus {
  systemStatus {
    databaseSchema
    databasePath
    appSchema
    status
    configPath
    os
    workingDir
    homeDir
    ffmpegPath
    ffprobePath
  }
}
query SceneMetadataEntityModelStatus {
  sceneMetadataEntityModelStatus {
    modelID
    version
    state
    cachePath
    lastError
    runtimeAvailable
    active
  }
}
